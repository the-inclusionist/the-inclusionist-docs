# SPDX-License-Identifier: AGPL-3.0-or-later
#
# THE GATE OF THE RECORDS — ADR-0123.
#
# ⚠️ IT DOES NOT CHECK OUT THE ENGINE, and that is a decision rather than an omission (ADR-0123 §5). A record
# naming an engine artefact that disappeared is the ENGINE's breakage, and it must redden where somebody can
# fix it. Making this repository red on another repository's rename is the coupling ADR-0121 was written
# about, pointing the other way.
#
# 📌 So the `confirmed-by` paths qualified with `engine:` are NOT opened here — the validator counts them and
# says so on every run, which is the whole defence against a sieve that checks nothing and prints «all sound».
# The engine's own `adr` job is what opens them, with `--repo engine=.`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # The validator's only dependency. Without it, it exits with a message of its own instead of a traceback.
      - run: pip install pyyaml

      # ⚠️ NO PIPE. The exit code is the gate, and a `| tail` hides it — a lesson paid for in this project more
      # than once: «N passed» coexists with a non-zero exit.
      - name: validate the records
        run: python scripts/validate-adr.py docs/2-Architecture/adr --repo docs=.

      # 🎯 THE GATE OF THE GATE (ADR-0123 §3): that the validator SAYS what it did not check. Without this line,
      # deleting that notice leaves it printing «tudo são» without having opened a single artefact, and nothing fails.
      - name: the validator says what it did NOT check
        run: python scripts/test-validate-adr.py

      - name: a record does not contradict its own tree
        run: python scripts/tempo-dos-registos.py

      - name: the debt census stays alive
        run: python scripts/test-divida-dos-registos.py

      # A REPORT, not a gate: it never fails (ADR-0126). It runs here so the number shows up on its own instead
      # of only when someone gets suspicious — which is how the twelve debtors were found.
      - name: how many records owe work nobody can find
        run: python scripts/divida-dos-registos.py
