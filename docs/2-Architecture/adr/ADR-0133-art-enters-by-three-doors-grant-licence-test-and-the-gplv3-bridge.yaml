        Tiny Swords atrasado numa leitura de fronteira.** A leitura não era de fronteira nenhuma: equipar
        uma engine com o pacote inteiro e entregá-lo a trezentos jogos é *repackage* e *redistribute* no
        sentido mais directo da frase do autor. 📌 E a resposta não é pedir-lhe autorização — seria pedir
        licença exactamente para aquilo que ele escreveu a linha para impedir. **É NÃO CONVEIAR.**
        🎯 Então a pergunta 3 passa a ROTEAR: quem pode ser conveiado viaja connosco; quem não pode é
        **obtido por quem instala, da origem**, e não entra nesta árvore nem no pacote. O precedente já existe
        e é idêntico: o **ADR-0108** decidiu que a fonte Ronde não pode ser empacotada, então oferece-se o
        download e a opção fica desabilitada enquanto o ficheiro não estiver presente.
        🔴 **E MEDIDO NO MESMO TURNO, o que fecha a porta à versão automática disto:** nem `itch.io` nem
        `kenney.nl` mandam cabeçalho CORS, e o itch não tem link directo estável (`/download` responde 404
        sem sessão). O buscador de pesados funciona com o Hugging Face e o jsDelivr porque ELES mandam o
        cabeçalho. **Logo a engine não consegue buscar do itch: só uma pessoa consegue.** ⚠️ Isto não afecta
        o Kenney, que é CC0 e portanto pode ser servido por nós — o obstáculo do CORS só morde onde a licença
        já nos proibia de servir.
