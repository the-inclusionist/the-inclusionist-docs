  errata:
    - date: 2026-09-09
      what: >-
        THE SECOND DOOR WAS REWRITTEN THE DAY IT WAS WRITTEN, and both halves of it were wrong. The first
        version said «a CC licence adequate to our work» and defined adequate by a TEST — allows derivatives
        and allows commercial use — with CC BY-SA admitted under a quarantine. Two defects, and the Dev found
        the first by naming a licence the record would have excluded. ① **«CC» named a FAMILY where the rule
        is about a PROPERTY**, so OGA-BY was shut out although it is CC BY minus one restriction and is
        therefore strictly more permissive; Creative Commons itself says it does not endorse OGA-BY, so the
        word «CC» excluded it by construction. It is the same defect ADR-0107 committed and this record was
        written to correct — a wall hung on the wrong property — repeated one level up, on the same day.
        ② **THE TEST ADMITTED SHARE-ALIKE AND PAID FOR IT WITH A QUARANTINE**, which the Dev has now refused:
        «nada de quarentena, melhor não aceitar por enquanto». The list below is therefore CLOSED and
        ENUMERATED rather than derived from a test, because a test invites argument at the edges and a list
        does not. ⚠️ What this erratum costs is written in the consequences and is not small: the Liberated
        Pixel Cup no longer enters, and ADR-0107 falls whole.

    - date: 2026-09-09
      what: >-
        🔴 A PREMISSA MAIS PESADA DESTE REGISTO E DO ADR-0107 ERA FALSA, e foi o Dev que a derrubou. Decisão
        dele: NENHUMA arte de contribuinte entrou no projecto, e nenhuma entrará enquanto este regime não
        estiver resolvido; quem contribuir produzirá arte compatível com o que o projecto decidir. Os dois
        registos argumentavam contra um PERIGO PRESENTE — «o share-alike alcançaria a obra de terceiro e
        licenciá-la-ia sem lhe perguntar» —, e esse perigo descrevia um corpo de arte que não existe. 🎯 A
        correcção inverte a ORDEM DE PRECEDÊNCIA e torna a decisão mais barata em vez de mais cara: o regime
        de licença da arte é uma POLÍTICA QUE O PROJECTO ESCOLHE, e quem contribuir adapta-se a ela — não uma
        restrição herdada de obra já feita. Ninguém na sala perde nada por a lista ser fechada. ⚠️ O pilar 10
        fica intacto e muda de alcance: continua a dizer que o projecto não decide pela artista, o que agora
        significa «não se lhe impõe um regime depois do facto», e não «existe arte não-FOSS a proteger». E o
        argumento que sobrevive contra o share-alike deixa de ser sobre a obra de terceiro e passa a ser sobre a
        SAÍDA: o que o pipeline produzir sai share-alike, e essa é a arte futura do próprio projecto.
        📌 A errata é declarada em vez de o texto ser corrigido em silêncio porque o raciocínio velho é o que
        explica por que o ADR-0107 construiu uma quarentena — apagá-lo faria aquela decisão parecer capricho.
    - date: 2026-09-09
      what: >-
        O REGISTO NÃO CARREGAVA A PONTE PARA A AGPL, e ela existe. O Dev trouxe-a com fontes e mandou-a
        constar: ① a **CC BY-SA 3.0 §4(b)(ii)** permite distribuir uma Adaptação sob «a later version of this
        License with the same License Elements», logo uma derivada de material 3.0 pode sair **4.0**; ② a
        Creative Commons declarou a **GPLv3** uma «BY-SA Compatible License» a 08/10/2015, de sentido único
        (BY-SA 4.0 → GPLv3, nunca ao contrário); ③ e o **§13 da GPLv3**, lido literalmente do texto SPDX, dá
        «permission to link or combine any covered work with a work licensed under version 3 of the GNU
        Affero General Public License into a single combined work». **Existe, portanto, um caminho legal de
        arte CC BY-SA 4.0 até um ecossistema AGPLv3, com a GPLv3 como ponte.** ⚠️ E o registo diz que o
        caminho existe E QUE O PROJECTO O RECUSA, com os quatro custos escritos, para ninguém o redescobrir do
        zero daqui a um ano e concluir que a decisão foi tomada por ignorância. Ver more-information.
    - date: 2026-09-09
      what: >-
        🔴 A LISTA FECHADA CAIU NO MESMO DIA, E PELA TERCEIRA VEZ PELO MESMO DEFEITO. A errata acima
        substituiu «uma licença CC» por «uma destas quatro» e chamou-lhe conserto — ⚠️ **mas uma lista
        fechada é um teste de família com outro chapéu**, e recusa exactamente da mesma maneira: por um nome
        não estar nela. O Dev apanhou-o com dois casos concretos. ① O **Tiny Swords** tem termos que permitem
