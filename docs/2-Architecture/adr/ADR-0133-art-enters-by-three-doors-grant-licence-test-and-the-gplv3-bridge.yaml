        este projecto já cumpre por construção. ⚠️ O que NÃO muda: ND e NC continuam sem caminho nenhum.
    - date: 2026-09-09
      what: >-
        🔴 A PERGUNTA 3 NÃO É UM CRITÉRIO DE ADMISSÃO — É UM ENCAMINHAMENTO DE ENTREGA, e foi o Dev que
        o viu: «não é necessário pedir, mas sim baixar e apontar para os assets baixados. A permissão dele
        é que eu poderia usar os assets num jogo, mas o que estamos fazendo aqui é equipar a engine com o
        pacote inteiro! Ou seja, justamente no que a licença pessoal dele pede para não fazer.»
