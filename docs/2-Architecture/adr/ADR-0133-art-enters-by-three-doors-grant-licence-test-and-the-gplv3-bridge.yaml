        declaração de compatibilidade publicada pela própria Creative Commons que a leva até um projecto AGPL.
        🎯 **O teste passa a ser COMPATIBILIDADE COM O PROJECTO, em quatro perguntas**, e a lista de nomes
        passa a ser EXEMPLOS. Nasce uma TERCEIRA porta para copyleft, com quatro condições lidas nas fontes —
