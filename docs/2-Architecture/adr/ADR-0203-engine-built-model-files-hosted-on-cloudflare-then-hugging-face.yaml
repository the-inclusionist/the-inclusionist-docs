title: Model files the project builds are hosted on its Cloudflare, then on Hugging Face

context-and-problem-statement: |
  The heavy-file catalogue needs an upstream address and a sha256 for every file (ADR-0177). The Vosk worker and wasm compiled here,
  the Vosk models repacked as `tar.gz`, and the Spanish Moonshine exported to ONNX exist only on the developer's machine. Asked where
  to publish them, the Dev, 2026-09-14: «Na CloudFlare, como parte do projeto Inclusionista por enquanto. Após futura permissão da
  prefeitura, no Hugging Face. Importante: documente o passo a passo para criação desta versão do modelo para quando formos levá-los
  ao Hugging Face. Documente o passo a passo sobre como usarmos cada modelo no repositório principal da engine. Organize eles na pasta
  C:\Users\candi\Claude\the-inclusionist-lfs para facilitar subirmos aos locais corretos.»

decision-drivers:
  - "D1 — A FILE THE CATALOGUE NAMES HAS AN ADDRESS: built here is no excuse for a missing one"
  - "D2 — THE PUBLIC MODEL HUB WAITS FOR PERMISSION: until the city allows it, the files stay under the project's own hosting"
  - "D3 — REBUILDABLE BY SOMEONE ELSE: every file ships with the steps that made it"

considered-options:
  - "A — publish on Hugging Face now"
  - "B — the project's Cloudflare now, Hugging Face after the city's permission"

pros-and-cons-of-the-options: |
  **A.** ✅ Where models are usually found. ❌ A public publication before the permission the Dev waits for.
  **B.** ✅ The catalogue gets addresses now, under the project's name. ❌ The addresses change once, when the files move.

decision-outcome:
  chosen-option:
    link: "B — Cloudflare now, Hugging Face later"
    justification: |
      1. **The files the project builds are hosted on its Cloudflare** as part of The Inclusionist, and the heavy-file catalogue names
         those addresses with each file's sha256.
      2. **After the city's permission they move to Hugging Face**; the catalogue's addresses change then, the sha256 stay.
      3. **Every artefact carries its recipe**: the step-by-step that rebuilds that exact version, written for the move to Hugging Face.
      4. **The engine repository documents how each model is used** (`engine:docs/6-DevOps-SRE/speech-models.md`).
      5. **They are staged in `the-inclusionist-lfs`**, one folder per artefact laid out as its future Hugging Face repository, with
         `SHA256SUMS`. The Dev uploads them: publishing is the Dev's.

  consequences:
    positive:
      - "The rebuilt Vosk and the Spanish Moonshine can enter the catalogue"
    negative:
      - "One change of addresses when the files move to Hugging Face"

  confirmation: |
    ⚠️ NOT BUILT YET — **issues #184 and #185** in `the-inclusionist-engine`. Gates: every catalogue entry of a project-built file
    has an address and a sha256 matching the staged `SHA256SUMS`; each staged folder has a recipe that rebuilt its file.

more-information: |
  The staging folder is outside the repositories: the files are too large for git and are not code.
