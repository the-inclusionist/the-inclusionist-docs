title: Every transport presses the virtual controller — the engine has ONE door to the cartridge

context-and-problem-statement: |
  ADR-0111 and its erratum decided that the engine handles the hardware and hands the game the virtual button's name, and
  that `input/virtual-controller` is the single place where that happens. 📏 Measured on 2026-09-22, it is not: there are two
  doors, and two transports that use neither.

  🔴 **A cartridge that listens only to `onCommand` does not respond to a finger or to a controller.** The touch pad writes
  KEYS — its own module says the on-screen button «finge ser o teclado» — and the root's window listener excludes the source
  `toque` explicitly, with a comment claiming «those come as commands already», which is true of the eyes and false of the
  thumb. The gamepad raises EDGES on the player object and passes through neither door. A cartridge written BEFORE the
  erratum reads keys and works with both; the demo quiz, written after it, listens only to commands — and a child on a
  tablet gets nothing.

  ⚠️ **And the two doors disagree with each other**, which is the second cost of having two. With a menu open the controller
  delivers nothing and the listener still delivers the `keyup`. The controller keeps a `held` map precisely so that «a game
  must never be left believing a button is still down»; the listener has no memory, so a press swallowed by a menu followed
  by a release hands the cartridge a release with no press. And the listener delivers for a synthetic event nobody signed.

  📌 The co-change says the same thing without being asked: `keydown`, `gamepad` and `touch-bindings` change together in
  40–53% of the commits that touch them.

decision-drivers:
  - "D1 — THE CARTRIDGE HAS ONE INPUT. That is ADR-0111, and today it is a promise the engine does not keep for two of its six transports"
  - "D2 — A RULE WRITTEN TWICE DIVERGES, and these two already have: three measured disagreements, each of which is a defect on one side"
  - "D3 — THE ENGINE IS IMPROVED FIRST AND THE GAMES ADAPT. The Dev's words: «o compromisso dela é ser melhor e isso está acima de ser compatível». What a cartridge reads today is not a constraint on this decision"
  - "D4 — THE SOURCE SURVIVES (ADR-0109): a command must still say which transport produced it, or the erasure that record closed comes back through the new door"
  - "D5 — WHAT IS HELD MUST STILL BE HELD: games that ask what key is down keep asking, so pressing the controller keeps holding the child's key underneath"

considered-options:
  - "A — every transport presses `input/virtual-controller`; the window listener stops delivering, and becomes what it always was: the keyboard's driver"
  - "B — unify the other way: the controller synthesises stamped key events, and the window listener is the single door"
  - "C — leave two doors and make them agree, case by case"
  - "D — leave it: a cartridge that wants the finger reads keys"

pros-and-cons-of-the-options: |
  **A.** ✅ One implementation of one decision, and it is the one ADR-0111 already chose; the `held` map, the menu rule and
  the source stamp start applying to all six transports at once. ✅ It is also the only option where a position the child's
  scheme gives NO key still reaches the game — the map belongs to the cartridge, not to the keyboard. ❌ Breaking for a
  cartridge that reads edges (the platformer's physics reads `playerEdge`), and for anything that watched keys to learn what
  the pad did.
  **B.** ✅ Smaller diff: touch and gamepad already produce key-shaped input. ❌ It makes the KEYBOARD the engine's model of
  input, which is what ADR-0111 decided against: a position with no key bound becomes unreachable, and every transport has
  to invent a key to speak. ❌ And the synthetic-event path is the one with no `held` memory.
  **C.** ❌ Two implementations that agree today diverge tomorrow; this is the third time these two have been found
  disagreeing. It also keeps the 40–53% co-change, which is the measurement that says the duplication is real.
  **D.** ❌ It leaves the engine unable to answer «why does my game not respond to touch?» with anything but «read keys
  instead», which contradicts the contract it publishes.

decision-outcome:
  chosen-option:
    link: "A — every transport presses the virtual controller"
    justification: |
      1. **`input/touch-bindings` and `input/gamepad` press and release `input/virtual-controller`**, with their sources
         (`toque`, `gamepad`), instead of writing keys and raising edges. What the controller already does then applies to
         them: a menu takes the position as its key, play holds the child's key AND delivers the command, and the release is
         delivered for every press the game heard.
      2. **The root's window listener stops delivering commands.** It goes back to being the keyboard's driver: it resolves
         the action and presses the same controller. After this there is one `deliver`, called from one place.
      3. **The `held` map, the menu rule and the source stamp become universal.** ⚠️ The three measured disagreements are
         resolved by the controller's answer in all three cases, because it is the one with the memory: no delivery with a
         menu open, a release only for a delivered press, and no delivery for an event nobody signed.
      4. **Edges keep being raised** — `playerEdge` is how the physics of a cartridge learns a button was tapped — but they
         stop being the gamepad's only output. Raising them becomes a consequence of a press, in one place, for every
         transport, instead of a thing one transport does on its own.
      5. **BREAKING, and the note says what to change**: a cartridge that learned about the pad or the controller by
         watching keys or edges now receives `onCommand`, the same way it already receives the eyes and the voice.

  consequences:
    positive:
      - "A cartridge written against `onCommand` responds to all six transports, which is what ADR-0111 promised"
      - "One implementation of the menu rule, of the held-key memory and of the source stamp, instead of two that have already been measured disagreeing three times"
      - "The 40–53% co-change of `keydown`, `gamepad` and `touch-bindings` becomes the criterion that tells us whether this worked (ADR-0221 step 7e), and it is recorded BEFORE the work"
    negative:
      - "Breaking for cartridges that read keys or edges to learn what the pad did — they adapt to the new version, which is the engine's compromise being better before being compatible"
      - "The touch pad stops being able to claim it «is» the keyboard, and any behaviour that depended on that identity has to be found and named"
      - "The gamepad's path becomes longer: a button now resolves to a position, the position to a key, and the key to the state — three hops where there was one"

  confirmation: |
    ⏸ **NOT YET BUILT — this record is the decision (ADR-0128), and the work is the next commits.** What will confirm it:
    a case per transport showing that a press reaches `onCommand` with its source; a case showing a release is delivered
    only for a press the game heard, with a menu opening in between; and a case showing that a position with no key bound
    still reaches the cartridge. Each red by mutation before it counts.
    📏 And the closing criterion is already fixed, with its number taken before the work: `node scripts/co-change.mjs
    --group transports` says 25% before the virtual controller and 50% after over four commits — not a result, and the
    script says so. It becomes one when there are commits to read.

more-information: |
  📌 What this record does NOT decide: whether the cartridge keeps receiving keys at all. It does — `holdKey` stays, because
  a game that asks what is held must keep getting an answer, and that is driver D5. What changes is that the key is no longer
  how a transport TALKS to the cartridge; it is a side effect of a press, written in one place.
  ⚠️ And the comment in `boot/create-game` that excludes `toque` from the window listener — «those come as commands already,
  or went to a menu» — was true of the eyes when it was written and became false when touch joined the list. It is the
  smaller lesson of this record: a comment that justifies a list ages with the list.
