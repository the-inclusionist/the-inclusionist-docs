title: Kokoro's voices are options in any browser, marked by quality, and come through the game's port

context-and-problem-statement: |
  ADR-0185 and ADR-0186 listed a Kokoro voice only where the model was cached and WebGPU ran. Measured, WebGPU can exist and still
  produce noise, and WASM runs it everywhere, slower. Asked which voice speaks first, where Kokoro may run and how a game delivers it,
  the Dev, 2026-09-14: for Portuguese and Spanish the Piper voice stays first and «todas as vozes do Kokoro ficam como opção, com a
  diferença que enquanto as pipers são sinalizadas com a pena, as duas únicas vozes boas do kokoro (Heart e Bella) devem ser
  sinalizadas com emoji de coração»; Kokoro «Roda em qualquer navegador»; and, on a port the game fills, with espeak-ng under
  GPL-3.0: «Sim.» The Spanish Piper voice is `es_MX-claude-high` («Piper para espanhol seria claude-high, español mexico»).

decision-drivers:
  - "D1 — A VOICE LISTED IS A VOICE THAT SPEAKS: never one whose runtime produces noise on this device"
  - "D2 — THE ENGINE NAMES NO PROVIDER (ADR-0094)"

considered-options:
  - "A — Kokoro listed only where WebGPU runs (ADR-0185 §2)"
  - "B — every Kokoro voice of the language listed in any browser, through a port the game fills"

pros-and-cons-of-the-options: |
  **A.** ✅ Fast wherever listed. ❌ Absent from most school devices, and listed where WebGPU exists but fails.
  **B.** ✅ The voices wherever the game ships them. ❌ On WASM a sentence takes about as long to make as to say on a fast machine.

decision-outcome:
  chosen-option:
    link: "B — options in any browser, through the game's port"
    justification: |
      1. **Every Kokoro voice of the page's language is listed as an option, in any browser**, beside the Piper voices.
      2. **In Portuguese and Spanish the Piper voice stays first** (`pt_BR-faber-medium`, `es_MX-claude-high`); the Kokoro voices
         follow as options.
      3. **Piper voices carry the feather (🪶); Kokoro's Heart and Bella carry a heart (❤️)** — the two good Kokoro voices; the other
         Kokoro voices carry no mark.
      4. **Kokoro runs on WebGPU where a short test synthesis gives speech, and on WASM with threads otherwise**, so a device whose
         WebGPU produces noise still speaks.
      5. **The game delivers Kokoro through a port, as ADR-0094 does for Piper**: it hands the engine how to load the phonemizer
         (espeak-ng), the runtime (onnxruntime) and the model and voices; the engine names none of them. espeak-ng is
         GPL-3.0-or-later, compatible with the engine's AGPL, and enters LICENSES.md where it is bundled.

  consequences:
    positive:
      - "A child on any device can pick a Kokoro voice, and knows the two good ones by the heart"
    negative:
      - "On WASM a sentence may take as long to make as to say; menu narration on a school laptop may lag"
      - "A new optional contract field, and the phonemizer's GPL licence travels with a game that bundles it"
      - "Which of an English child's voices speaks first is still not decided"

  confirmation: |
    ⚠️ NOT BUILT YET — **issue #181** in `the-inclusionist-engine`. Gates: in Portuguese the list starts with Faber and holds the
    Kokoro Portuguese voices after it; in English Heart and Bella carry a heart and a Piper voice the feather; with WebGPU producing
    non-speech the test synthesis falls back to WASM; without the port no Kokoro voice is listed and the line says why.

more-information: |
  The Kokoro English order (Heart or a Piper voice first) is left open, as ADR-0186 left it.
