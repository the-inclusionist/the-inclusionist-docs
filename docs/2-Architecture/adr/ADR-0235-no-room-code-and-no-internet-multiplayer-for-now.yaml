title: No room code and no internet multiplayer for now — everything runs offline and single-machine

context-and-problem-statement: |
  ADR-0037 kept one code alive after abolishing the save: the teacher's room key, which would drop a child into a class
  room on the school LAN. ADR-0228 then moved that code's module to the platformer, and the audit of 2026-09-25 found
  the room had no owner. Issue #22 still asked for a security study of internet multiplayer.

decision-drivers:
  - "Offline first (pillar 8): nothing now depends on a network or a server"
  - "A room or an internet session needs a backend, and the backend is Bússola Escolar, which is not ready"

considered-options:
  - "A · Keep the room code and study internet multiplayer now"
  - "B · No room code and no internet multiplayer until Bússola Escolar serves as backend and server"

pros-and-cons-of-the-options: |
  **A.** ❌ A room and an internet session both need a server this project does not have. **B.** ✅ Nothing is built for a
  backend that does not exist. ❌ The study in #22 waits.

decision-outcome:
  chosen-option:
    link: "B — no room code, no internet multiplayer, until Bússola Escolar is the backend"
    justification: |
      The Dev's decision. ADR-0037's no-save and no-child-data rules stand; its room key does not: there is no room, and
      `core/password` (now in game-platformer) is no longer a platform concern. Internet multiplayer comes after Bússola
      Escolar works well and serves as backend and server, and its security study is done then. Local multiplayer on
      separate screens (ADR-0008) is unaffected.

  consequences:
    positive:
      - "Nothing depends on a network or a server"
    negative:
      - "Internet play and its threat model wait for Bússola Escolar"

  confirmation: |
    Nothing to build: this record removes work. Issue #22 closes with it.

more-information: |
  When Bússola Escolar is ready, the room and the internet session are designed together, with the study #22 asked for.
