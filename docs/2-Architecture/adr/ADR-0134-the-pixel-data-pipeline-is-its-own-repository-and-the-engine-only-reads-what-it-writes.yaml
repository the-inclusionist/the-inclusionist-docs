        📌 THIS IS A TRADE THE DECISION ALREADY MADE, stated late rather than changed. §4 collapses every
        fully transparent pixel to one key precisely so that two files identical to the eye cannot get
        different index grids — one storing white-at-zero-alpha where the other stores black — because that
        would cost the variant harvest 436 files and its larger groups — 📏 measured on the LPC, and the
