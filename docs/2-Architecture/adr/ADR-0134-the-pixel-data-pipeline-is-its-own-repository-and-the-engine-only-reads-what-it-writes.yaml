        ① The «119» was NEVER COMPUTED. The measuring script printed the groups without summing them, so the
        figure was supplied from memory.
        🎯 AND ITS ORIGIN IS WORTH KEEPING, because it is the general shape of this kind of error: 119 is a
        REAL measured number from the same table — the count of files carrying partial alpha, one section
        above. The wrong figure was not invented; a true figure was carried across from a neighbouring row.
        That is why it read as measured, and why nothing about it looked suspicious.
        ② The «seven» was a `head -60` truncating the script's output at a boundary that made the short list
        look complete. Thirty-five palette groups were cut off, and nothing in the output said so.
        📌 AND THE CORRECTION RUNS TOWARDS THE DECISION, not against it. The record warned that the palette
        grouping was RARE and that the file boundary might therefore degenerate to one file per image; at
        forty-two groups covering 139 of 197 files it is not rare, and every group is semantically exact —
        the largest gathers four different subjects sharing a palette because they share a MATERIAL. The
        negative consequence written on the strength of «seven» is withdrawn below.
        🎯 What makes the new figures worth more than the old ones is that TWO INDEPENDENT IMPLEMENTATIONS
        now agree on them: the throwaway measuring script, and `src/group/group.ts`, written afterwards from
        tests and by another route.
    - date: 2026-09-09
      what: >-
