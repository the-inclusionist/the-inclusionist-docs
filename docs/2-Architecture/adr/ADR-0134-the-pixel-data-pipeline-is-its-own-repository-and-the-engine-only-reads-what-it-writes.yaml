        ⚠️ AND IT CARRIES A CONDITION, which is the part worth having in the record: hidden RGB DOES matter
        under bilinear filtering and mipmapping, which sample transparent texels and bleed their colour into
        visible edges. It does not matter for this project because its art renders NEAREST by mandate
