        it. The confirmation promised «PNG → semantic file plus palette → recomposed → the same pixel». The
        true claim is **the same VISIBLE pixel**: RGB stored underneath a fully transparent pixel is not
        preserved. 📏 Verified over the same 197 files — 41 512 960 pixels compared, 197 of 197 identical
