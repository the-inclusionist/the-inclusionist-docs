title: The default simplification is 2⁸, bought against the measurement and with its price stated

context-and-problem-statement: |
  ADR-0137 made the tool open already simplified, and set the level at `MAX_BITS` — 2¹⁵ — on the argument
  that a default is a choice nobody revisits and must therefore be safe unlooked-at. The Dev has decided
  otherwise, in one line:

    «O padrão ao importar deve ser 2^8.»

  🔴 THIS IS A TRADE BEING BOUGHT, NOT A DISAGREEMENT ABOUT FACTS. The measurement is the same one, run over
  the same folder — the LPC's `Body/Base`, 269 files, eleven workspaces — and it says both halves plainly:

    | level | positions across the folder | worst single-channel error in any palette |
    |-------|-----------------------------|-------------------------------------------|
    | 2¹⁵   | 1056 → 564                  | **7**                                     |
    | 2⁸    | 1056 → **274**              | **123** on one workspace, 40–60 on five   |

  🎯 What 2⁸ buys is the thing this repository exists to produce: a **procedural drawing half again simpler**,
  which every consumer of the file reads for as long as the file exists. What it costs is colour — at 2⁸ a
  shifted colour is one a person can see, where at 2¹⁵ it is not.

  ⚠️ AND THE COST IS NOT EVEN ACROSS THE ART. The same 2⁸ leaves a 15-file `Coffee` workspace with a worst
  error of 118 and an 11-position palette almost untouched at 10 positions, while `Gold` — the largest, 195
  files — goes from 22 positions to 15 for an error of 40. There is no level at which the loss is uniform,
  which is why ADR-0136 put the price of every level on the control and why that stays.

decision-drivers:
  - "🔴 The choice belongs to the Dev. The measurement is an input to it, not a veto over it — and this
     record's job is to make sure the trade is written down, not to re-argue it."
  - "🎯 The simpler procedural drawing is the product. 274 positions against 564 is half again less for every
     reader of every file, forever."
  - "⚠️ A default that loses colour visibly must be visible, priced and reversible — which is exactly what
     ADR-0137 §4 already requires of any default here."
  - "Provenance must not lie: a file simplified at 2⁸ records 8, and a reader can tell it from art that came
     in that way."

considered-options:
  - "L1 — keep ADR-0137 §2: open at 2¹⁵, the level measured safe unlooked-at"
  - "L2 — open at 2⁸, as instructed"
  - "L3 — open at 2⁸ but warn when the measured error exceeds some number"

