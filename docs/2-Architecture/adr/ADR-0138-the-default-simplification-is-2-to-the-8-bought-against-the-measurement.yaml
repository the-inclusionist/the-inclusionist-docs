decision-outcome:
  chosen-option:
    link: "L2 — open at 2⁸"
    justification: |
      ===== 1. THE LEVEL =====
      `OPENS_AT` is `MIN_BITS` — 2⁸, 256 colours. Every route that opens a workspace starts there, the
      chooser preselects «2^8 — N posições, erro máx M» with N and M measured on the art in hand, the footer
      reads «simplificado a 2^8», and the file records `simplifiedToBits: 8`.

      ===== 2. WHAT DOES NOT CHANGE =====
      ADR-0137 §1 stands: the tool opens on the art it will DELIVER, and that is why there is a default at
      all. ADR-0136 stands entire: positions are merged after grouping and never colours before, the survivor
      is the most-used colour of its bucket, alpha is never quantised, every level is priced on the control,
      and a reader refuses a `simplifiedToBits` outside 8 to 15.

      ===== 3. WHAT THIS RECORD IS FOR =====
      🔴 IT EXISTS SO THE PRICE IS ON PAPER. The code says `MIN_BITS`; only a record says that 2⁸ costs a
      visible colour on some art and that this was known when it was chosen. Without it the next person to
      read the comment beside `OPENS_AT` would find a default that looks like an oversight and «fix» it.

  consequences:
    positive:
      - "📏 The procedural drawing is half again simpler than at 2¹⁵ and a quarter of what came in: across
         `Body/Base`, 1056 positions become 274; on the `Skeleton`, 253 become 38."
      - "A person annotating writes 38 meanings where they would have written 253 — and every one of them is
         a position the file will actually hold."
    negative:
      - "🔴 COLOUR IS LOST WHERE A PERSON CAN SEE IT. 📏 Worst single-channel error 123 on one workspace of
         `Body/Base`, 40–60 on five more. At 2¹⁵ it was 7."
      - "⚠️ Somebody who never opens the chooser ships that. The footer names the level at all times and the
         file records it; nothing stronger warns them, by the same argument that refused a threshold."
      - "Art that must keep its colours needs “sem simplificar” chosen deliberately before saving."
    neutral:
      - "The cost table of ADR-0136 is what makes this answerable rather than a leap: the person sees, on the
         option already selected, how many positions remain and the worst error any palette would suffer."

  confirmation: |
    ⚠️ NOT CONFIRMED BY THE CONSUMER — the engine's reader does not exist. What holds today:

      · 📏 Measured over the LPC's `Body/Base` (269 files, eleven workspaces) with the same `workspacesIn` and
        `costOfSimplifying` the interface calls: 2⁸ → 274 positions, worst error 123; 2¹⁵ → 564, worst 7.
      · 📏 Verified on screen against the real `Skeleton` folder: the import opens on «2^8 — 38 posições, erro
        máx 60», panel 4 lists 38 rows, and the footer reads «posições: 38 · simplificado a 2^8».
      · `OPENS_AT` is held by a case asserting it is `MIN_BITS`, and a mutation moving it to 12 turns the
        suite red — so the level cannot drift without the decision being revisited.
      · Gates: `tsc` 0 · 221 cases · `build` 0 · 69/69 mutations caught.

more-information: |
  SUPERSEDES ADR-0137 §2 — the level, and nothing else. §1, §3 and §4 of that record govern unchanged, and §4
  is what makes this one defensible: a default is admissible when it is visible, reversible and recorded.
  This record adds the fourth thing that a default costing visible colour needs, which is that the price is
  written down beside the choice.

  📌 A NOTE ON WHY THIS IS NOT AN ERRATUM. ADR-0057 allows an edit in place only when the author, holding the
  corrected facts, would have written the same choice. ADR-0137 §2 chose 2¹⁵ BECAUSE of these very numbers,
  so it fails that test: the facts did not change, the decision did.
