title: Code health is a ratchet, never a score

context-and-problem-statement: |
  The Dev read a paper back that guided this engine's modularization and said the problems it had cured have come back. He is
  right, and the cause is mechanical rather than a lapse of care.

  📏 This engine gates the language (`portuguese-stays-out`), the DIRECTION of its dependencies (`dependencies-point-downward`,
  ADR-0173), its public surface, its exports without a consumer, and the pointers its records make. **It gates nothing about
  size, complexity, coupling or cohesion.** The layer gate asks which way an import points, never how many there are: a module
  may import 77 things downward and pass green. What nothing measures comes back.

  📏 And it has come back, measured with TypeScript's own parser: `boot/create-game.ts` is **2185 lines — 11% of all the
  engine's code in one file — with 330 decision nodes and fan-out 77**, where the next module imports 19. Being the composition
  root justifies a wide fan-out; it does not justify 330 branches, which are logic and not wiring.

  ⚠️ The paper is not a catalogue of good practices, and treating it as one would be the first mistake. It is a model that
  predicts expert judgement from a commit; the practices are implicit in what it WEIGHS — cohesion, complexity, coupling,
  dependency injection. And it carries its own warning: **maintainability has ICC 0.52 between raters and r = 0.30 against the
  model.** Ten experts with more than ten years each do not agree on how maintainable a commit is.

decision-drivers:
  - "D1 — IT MUST NOT BECOME A SCORE. The paper's own numbers say the judgement it would imitate does not converge; a number presented as quality would be obeyed more than it deserves"
  - "D2 — IT MUST NOT FIRE ON EVERY COMMIT: a gate woken one commit in seven is a gate that gets switched off, and this repository has the measurement that says so"
  - "D3 — THE CEILING COMES FROM THIS TREE, not from the literature: the paper prescribes no threshold, and borrowing one would dress it in an authority it never gave"
  - "D4 — IT MUST CATCH THE RECURRENCE, which has two shapes: a module that gets worse, and a NEW module born already big"
  - "D5 — IT MUST NOT PRETEND TO MEASURE WHAT IT CANNOT. Cohesion has no honest number for a tree of function modules"

considered-options:
  - "A — reproduce the paper's model: predict expert ratings per commit"
  - "B — fixed thresholds from the literature (cyclomatic complexity < 10, files < 300 lines…)"
  - "C — measure four dimensions, write a baseline, and ratchet it: nothing gets worse, a new module is born under a ceiling taken from the tree's own p90"
  - "D — nothing: rely on review, as until now"

pros-and-cons-of-the-options: |
  **A.** ✅ It is what the paper actually built, and it reaches r = 0.82 on coding time. ❌ It needs ten experts and 4 900
  judgements to calibrate, which we do not have — and the metric it predicts best (hours) changes no decision of ours. We do not
  schedule by estimate, and the one it predicts worst is the one we would want.
  **B.** ✅ Instant, and defensible-sounding. ❌ The paper prescribes no threshold, so any number would be ours wearing its
  coat. And 📏 a literature ceiling fails a dozen modules on day one, which is how a gate gets disabled in the first hurry.
  **C.** ✅ It is the shape this repository already trusts — `language-debt.json` and the debt of ADR-0173 both only shrink — and
  it answers both shapes of the recurrence. ❌ It cannot say a module is GOOD, only that it did not get worse; and the baseline
  freezes today's damage until someone pays it.
  **D.** ❌ It is what produced the question. `create-game` grew to 2185 lines with every gate green.

decision-outcome:
  chosen-option:
    link: "C — a measured baseline and a ratchet, with the ceiling taken from this tree"
    justification: |
      1. **Four measures, and each one is defined by what the parser can see, not by a name**: lines of code (comments
         excluded), decision nodes (`if`, loops, `switch`, `catch`, ternary), maximum decision depth, and fan-out (distinct
         relative imports). `fan-in` is recorded as INFORMATION and never limited — a module everybody uses is what
         `core/dom-query.ts` is at 4 lines and fan-in 17, and that is the shape to copy, not to cap.
      2. **🔴 COHESION IS NOT MEASURED, and saying so is part of the decision.** LCOM and its family assume classes with fields;
         this tree is modules of functions, and a number that means nothing is worse than no number — it would be obeyed. What
         stands in its place is the co-change table of `engine:docs/ARCHITECTURE.md` §3.3: files edited in the same commit are
         the honest evidence of what belongs together, and a long row there is a hypothesis about missing abstraction.
      3. **The ratchet, in the exact shape of `portuguese-stays-out`**: a per-module baseline in
         `engine:docs/6-DevOps-SRE/code-health.json`; no module may get worse on any of the four; a module that is NEW is born
         under a ceiling. ⚠️ The ceiling is the p90 of today's tree, written into the baseline file with the date it was taken —
         it is a fact about this repository, and it moves only when someone re-measures and says so.
      4. **Two exemptions, named with their reason, and no others**: `boot/create-game.ts` is exempt on FAN-OUT because wiring
         everything is its job (ADR-0173) — and is NOT exempt on lines, branches or depth, which is exactly where its debt is;
         and `i18n/pt|en|es.ts` are exempt entirely, because they are data, and 621 lines of sentences is not complexity.
      5. **Nothing here is a score, and no commit is judged by it.** The gate answers one question — «did anything get worse?» —
         and the answer is yes or no.
      6. **The success criterion of paying a debt is not the number falling.** It is the co-change falling: when an abstraction
         is adopted, the files it unifies stop changing together. That experiment is already written down in `ARCHITECTURE.md`
         §3.4 with its criterion fixed before the answer exists.

  consequences:
    positive:
      - "The recurrence the Dev named stops being invisible: a module that grows, or is born big, reddens the build"
      - "The debt becomes a list with sizes instead of an impression — `create-game` 2185/330/77 first, then `pause-icons`, `settings-audio`, `gamepad`"
      - "The paper stops being a citation in CLAUDE.md and becomes something the build checks"
    negative:
      - "A baseline freezes today's damage: until a debt is paid, the gate protects the bad number as carefully as a good one"
      - "Four numbers cannot say a module is well designed; they can only say it did not get worse — and the thing they cannot see, cohesion, is the one the paper weighs most"
      - "One more file to regenerate when a module is legitimately split, which is the cost of every ratchet this repository has"

  confirmation: |
    ⏸ **NOT YET BUILT — this record is the decision, and the work is step 7a/7b of the plan and issue #203.** The gate that will confirm it does
    not exist: `engine:tests/code-health.node.test.js` will read `engine:docs/6-DevOps-SRE/code-health.json` and refuse a module
    that got worse on any of the four measures, refuse a new module above the ceiling, and refuse a baseline entry for a module
    that no longer exists. Each rule red by mutation before it counts, as every gate here.
    📌 What this record will NOT claim when it is built: that the code is good. It will claim that it stopped getting worse, and
    the difference is the whole reason the paper's ICC 0.52 is quoted above.

more-information: |
  The paper is `arXiv:2409.15152`, already cited by `engine:CLAUDE.md` §3 as the foundation of the modularization. What is taken
  from it: the DIMENSIONS, and the caution. What is deliberately not taken: the model (a random forest calibrated on 4 900
  expert judgements in Java) and the time questions Q1/Q2 (r = 0.82 and 0.86) — we have no raters to calibrate, and estimating
  hours from a commit changes no decision here.
  📌 The two debts this will have to face first are already named in `engine:docs/ARCHITECTURE.md` §3.4, measured rather than
  supposed: there are two doors to the cartridge, and four of the nine settings panels use the panel kit.
