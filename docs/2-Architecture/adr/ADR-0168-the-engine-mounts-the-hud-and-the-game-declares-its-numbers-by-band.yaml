title: The engine mounts the HUD, and the game declares its numbers by band

context-and-problem-statement: |
  Study item C4 asked whether the engine should impose ADR-0059's four bands. 📏 Measured on 2026-09-13: six sibling games,
  six HUDs of their own (2048 a left column, chess, pinball, soccer and whack-whack their own, the platformer the engine's
  `ui/hud`), none in the bands; and two of ADR-0059's addresses were taken by later records — the clock's top centre by
  the quick bar (ADR-0148), the learning bars' bottom centre by the footer (ADR-0164).

  The Dev, asked «a engine deve passar a montar o HUD, com o jogo declarando os números por faixa? Se sim, onde ficam o
  relógio e as barras de aprendizagem»: «Sim, a engine deve passar a montar o HUD com o jogo declarando os números por
  faixa. Relógio: canto superior direito, à direita da barra de acessibilidade rápida. Barra de aprendizagem: centralizado
  no rodapé da tela, e por isso é tapada pela faixa de explicação quando ela se ativa (faixa de explicação é prioridade),
  o que não é um problema.»

decision-drivers:
  - "D1 — A NUMBER IN THE SAME PLACE IN EVERY GAME. ADR-0059's reason: a child who cannot hold two places in their head
     needs each number always where it was"
  - "D2 — ONE OWNER PER ZONE. The bar owns the top centre, the footer the bottom; the HUD fits around them"

considered-options:
  - "A — each game keeps its own HUD, following ADR-0059 by discipline"
  - "B — the engine mounts the HUD; the game declares its numbers by band"

pros-and-cons-of-the-options: |
  **A.** ✅ No contract change. ❌ Measured: no game followed the bands.
  **B.** ✅ The layout is the engine's, identical in every game. ❌ A contract field, and six HUDs to migrate.

decision-outcome:
  chosen-option:
    link: "B — the engine mounts the HUD, the game declares its numbers by band"
    justification: |
      1. **The engine mounts the HUD** in the game region; the game declares each number and the BAND it belongs to
         (ADR-0059 §1: identity, session, round, learning), and the engine places it. The rule that gives a number its
         band stays ADR-0059's.
      2. **The clock is at the top RIGHT corner, to the right of the quick accessibility bar.**
      3. **The learning bars are centred in the screen footer**, and the explanation band covers them while it is showing:
         the explanation has priority, and the Dev says that is not a problem.
      4. **Unchanged from ADR-0059:** identity top left (avatar, first name, the point count under it); round at the top
         right; in multiplayer the HUD repeats inside each screen.
      5. ⚠️ **Open, for the Dev:** the round band (super-power, a round's objective counter) was ADR-0059's top right, which
         is now also the clock's corner — how the two share it is not decided here.

  consequences:
    positive:
      - "Every game shows its numbers in the same places without re-deciding them"
    negative:
      - "A new contract field, and the six sibling games' HUDs migrate to it"
      - "The learning bars are hidden while an explanation shows"

  confirmation: |
    ⚠️ NOT BUILT YET — **issue #162** in `the-inclusionist-engine`. Gates: a game that declares numbers gets them
    in their bands without drawing a HUD; the clock sits right of the quick bar and intersects it nowhere; the learning bars
    sit centred in the footer and the explanation band covers them when shown.

more-information: |
  ADR-0059 stays the record of the RULE; this record owns who builds the HUD and the two addresses the later zones moved.
