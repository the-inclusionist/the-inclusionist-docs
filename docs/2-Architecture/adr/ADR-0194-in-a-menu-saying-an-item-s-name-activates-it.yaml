title: In a menu, saying an item's name activates it

context-and-problem-statement: |
  The voice test drove the quiz with direction words — «acima», «abaixo», «confirmar», «voltar», «menu» — each turned into a key.
  After trying it live, the Dev, 2026-09-13: «no menu, ao invés de navegar apenas falando abaixo, acima, confirma e voltar,
  gostaria de dizer o que está escrito na opção para acioná-la, o que é bem mais intuitivo.»

decision-drivers:
  - "D1 — WHAT THE CHILD SEES IS WHAT THE CHILD SAYS: walking a list by «abaixo» asks for a count the item's name already answers"

considered-options:
  - "A — direction words only"
  - "B — in a menu, the names of its items are also commands: saying one activates that item"

pros-and-cons-of-the-options: |
  **A.** ✅ A fixed grammar of a few words. ❌ Six «abaixo» to reach the sixth item.
  **B.** ✅ One utterance per choice, in the menu's own words. ❌ The grammar changes with every menu and language; two names that
  begin alike («Voltar», «Voltar ao jogo») must not fire on the shorter one early; a name with a word outside the model's
  vocabulary cannot be said.

decision-outcome:
  chosen-option:
    link: "B — an item's name activates it"
    justification: |
      1. **While a menu is open, the grammar holds the names of its items as shown, in the page's language**, beside the direction
         words, which keep working.
      2. **Saying a whole name activates that item**, as confirming it with the cursor on it would — the same action, the same
         spoken feedback.
      3. **On the partial hypothesis a name fires only when no other item's name continues it**; otherwise it waits for the end of
         the utterance.
      4. **A name with a word the model does not know is reported** (in `problems`, ADR-0169), and that item is reached by the
         direction words.
      5. A locked item (ADR-0161) said by name is not activated; its reason is spoken, as with the cursor.

  consequences:
    positive:
      - "A choice is one utterance, and it is the word on the screen"
    negative:
      - "The recogniser's grammar is rebuilt when a menu opens, closes or changes language"

  confirmation: |
    ⚠️ NOT BUILT YET — **issue #184** in `the-inclusionist-engine`. Gates: with the pause card open, saying an item's name
    activates it; «Voltar» does not fire while «Voltar ao jogo» may still be said; a locked item says its reason; a name with an
    unknown word is in `problems`; the grammar follows the language.

more-information: |
  Measured only for the pause card and the settings submenu in Portuguese, with the small model; the panels' rows, the other two
  languages and a child's voice are unmeasured.
