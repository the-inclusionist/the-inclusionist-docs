title: Art enters by two doors — procedural by the artist's grant, and CC licences that allow derivatives

context-and-problem-statement: |
  Until today the project's answer about outside art was written case by case. ADR-0018 said in July that
  outside art could serve only as design reference, written when the only outside art in view was a generator.
  ADR-0107 lifted that for one case in September — the Liberated Pixel Cup, taken under its CC BY-SA 3.0 arm
  and put in a quarantine. Neither states a rule, so the third case would be argued from scratch, and the
  fourth would be argued from the third.

  The Dev has now stated the rule: art enters by two doors, and by no others. The first is PROCEDURAL, when an
  artist grants the right to generate derivative art from her work. The second is WORKS UNDER A CC LICENCE
  ADEQUATE TO OUR WORK.

  🎯 THE SECOND DOOR NEEDS A DEFINITION OR IT IS NOT A DOOR, IT IS AN OPENING. «CC» is a family of seven
  licences whose terms differ in exactly the dimension that matters here, and the dimension is not obscure —
  ADR-0107 already measured it: **the procedural pipeline is a derivative-work machine.** A semantic image
  traced from a sprite is a derivative of that sprite. So a licence is adequate for this project only if it
  permits derivatives at all, and only if its own terms do not end up narrower than the licence the code
  already carries.

  ⚠️ AND PILLAR 10 IS WHY THE FIRST DOOR IS A GRANT AND NOT A POLICY. It says, in as many words, that the art
  is not the project's to license: a program is what Lei 9.609 defines, and art follows Lei 9.610 and belongs
  to whoever made it. The project cannot decide that an artist's work may be machine-derived; only she can.
  That is why this door is opened by her and not by this record.

decision-drivers:
  - "A rule stated once beats a case argued four times, and the fourth case is where the drift happens"
  - "The pipeline makes derivatives by construction, so 'may we derive' is the question that decides adequacy"
  - "The art's terms must never be narrower than the code's, or a user the AGPL permits is stopped by a sprite"
  - "Pillar 10 keeps the artist's decision hers, so her door is a grant she gives rather than a rule we write"
  - "Share-alike is a real hazard and it is about the LICENCE, not about the art being someone else's"

considered-options:
  - "A · two doors, with 'adequate CC' defined as allowing derivatives AND commercial use"
  - "B · two doors, with 'CC' left undefined and judged per case"
  - "C · keep the case-by-case practice: every new source gets its own record"

pros-and-cons-of-the-options:
  A:
    good:
      - "The next source is answered by reading a licence rather than by opening a decision."
      - "It makes the quarantine follow the hazard — share-alike — instead of following third-partyness."
      - "It states the incompatibility that would otherwise be discovered mid-pipeline: no-derivatives art cannot be recoloured, let alone traced."
    bad:
      - "🔴 A definition can be wrong at the edges, and CC-NC's ambiguity is famous — a school deployment might well be non-commercial, so this rules out art the project could arguably use."
      - "It closes the door on CC BY-ND collections that could still serve as pure reference, which ADR-0018's old rule permitted."
      - "⚠️ The project now has to READ licences per collection, and a collection with mixed per-asset licences is work nobody has scoped."
  B:
    good:
      - "No edge case is ruled out in advance; each is judged with its facts."
    bad:
      - "🔴 It is the current state renamed. 'Adequate' with no test is decided by whoever is in a hurry."
  C:
    good:
      - "Every source gets full consideration."
    bad:
      - "Three sources, three records, and the rule still unwritten — which is how ADR-0018's sentence survived two months past being true."

decision-outcome:
  chosen-option:
    link: "A — two doors, with adequacy defined"
    justification: |
      **Art enters this project by two doors and no others.**

      **The first door is PROCEDURAL, and it is opened by the artist.** When an artist grants the right for
      her work to be machine-derived — recoloured, re-regioned, turned into a semantic image — the pipeline
      may take it. The grant is hers to give because pillar 10 says the art is not ours to license, and it
      must be explicit: silence is not a grant, and neither is having been paid for the original.

      **The second door is a CC licence adequate to this work, and adequate has a test with two questions.**
      Does it allow DERIVATIVES? And does it allow COMMERCIAL use? Both must be yes.

      · **CC0 and CC BY — adequate, no quarantine.** Derivatives permitted, nothing propagates to the output,
        attribution required for BY and satisfied by the ledger.
      · **CC BY-SA — adequate, and QUARANTINED.** Derivatives are permitted, but the derivative inherits
        share-alike, which is the hazard ADR-0107 measured: a pipeline mixing sources would produce one asset
        under two incompatible regimes, and the share-alike would reach the artist's own work and license it
        without asking her. The quarantine is what keeps that from happening.
      · **CC BY-ND and any ND — NOT adequate.** No derivatives at all. The pipeline cannot take it, and this
        is not a formality: recolouring is already a derivative, so ND art cannot even become a palette swap.
      · **CC BY-NC and any NC — NOT adequate.** ⚠️ Not because the project sells anything, but because the
        art's terms would be NARROWER THAN THE CODE'S: the AGPL permits commercial use, so a downstream user
        the licence invites would be stopped by a sprite. And NC's boundary is genuinely unsettled — a
        municipal deployment sits exactly on it.

      🎯 **AND THE QUARANTINE MOVES FROM 'THIRD-PARTY' TO 'SHARE-ALIKE', which corrects ADR-0107 by its own
      reasoning.** That record put the LCP behind a wall because it was someone else's; measured, the hazard
      it describes is share-alike propagating into the artist's work. CC BY art from a third party carries no
      such hazard and needs no wall — only its ledger entry.

  consequences:
    good:
      - "The next collection is answered by reading its licence, not by opening a decision."
      - "The artist's work stays hers by construction: the pipeline may only take what she has granted."
      - "The quarantine now guards the actual hazard, so CC BY art can be used without ceremony that protects nothing."
      - "An incompatibility that would otherwise surface mid-pipeline — ND art that cannot even be recoloured — is stated before anyone imports it."
    bad:
      - "🔴 NC art is ruled out, and some of it would serve a school perfectly well. The reason is downstream users, who are not in the room."
      - "⚠️ A collection with per-asset licences has to be read per asset, and nobody has scoped that work — the LCP itself separates originals from derivatives in its own authorship files."
      - "The first door depends on a grant whose FORM is unspecified: nothing here says what a grant looks like, who records it, or where it lives."
      - "ADR-0018's reference-only rule had one virtue this loses — it could never produce a licensing mistake, because nothing was ever taken."

  confirmation: |
    ⚠️ NOT YET BUILT, and the debt is followable: **issue #140** carries it.

    The gates this owes:

    · NO ASSET FROM AN INADEQUATE LICENCE ENTERS — asserted over the attribution ledger rather than promised,
      in the shape `tests/lcp-quarantine.node.test.js` already uses. A ledger row naming an ND or NC licence
      fails, and the failure names the row.
    · EVERY IMPORTED ASSET HAS A LEDGER ROW WITH ITS LICENCE — the existing quarantine gate asserts rows exist;
      it does not yet assert that each row NAMES which of the adequate licences applies. Without that, «CC» in
      a row is the same undefined word this record just defined.
    · THE ARTIST'S GRANT IS RECORDED WHERE THE PIPELINE CAN SEE IT — 🔴 and this is the one with no shape yet.
      Nothing in the tree distinguishes art the artist granted for derivation from art she merely made. Until
      it does, the first door is honoured by memory, which is what every other rule in this repository has
      failed at.
    · 📌 The mixing rule of ADR-0107 survives unchanged and its gate stays: a resource of one origin may not
      derive from a resource of another. It is now the SHARE-ALIKE boundary rather than the third-party one.

more-information: |
  Supersedes ADR-0018 in part: «outside art only as design reference» falls as a rule, not merely for one
  case. ADR-0107 had already lifted it for the LCP; this states what replaces it.

  Supersedes ADR-0107 in part: the framing of quarantine as what THIRD-PARTY art requires. Its measurement,
  its mixing rule and its ledger all stand — what changes is that the wall follows share-alike, which is what
  that record's own analysis identified as the hazard.

  ADR-0010 pillar 10 is untouched and is load-bearing here: the art is not the project's to license, which is
  precisely why the first door is a grant from the artist rather than a permission this record could give.

  Deliberately NOT decided here: what form the artist's grant takes and where it is recorded; whether a
  collection with mixed per-asset licences may be imported partially; and whether ND art may still serve as
  pure design reference, which ADR-0018 permitted and this record neither restores nor forbids.
